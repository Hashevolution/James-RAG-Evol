<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROJECT JAMES</title>
<style>
  /* ── 리셋 & 변수 ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:        #0a0a0f;
    --surface:   #111118;
    --border:    #1e1e2e;
    --accent:    #7c6af7;
    --accent2:   #4fc3f7;
    --text:      #e8e8f0;
    --muted:     #555570;
    --success:   #4caf7d;
    --danger:    #f06292;
    --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
    --font-ui:   'Sora', 'Pretendard', sans-serif;
  }

  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap');

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── 헤더 ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .logo {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 2px;
    color: var(--accent);
    font-family: var(--font-mono);
  }
  .logo span { color: var(--accent2); }
  .header-right { display: flex; gap: 12px; align-items: center; }
  .source-toggle {
    display: flex;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    font-size: 11px;
    font-family: var(--font-mono);
  }
  .source-toggle button {
    padding: 5px 12px;
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    transition: all .2s;
  }
  .source-toggle button.active {
    background: var(--accent);
    color: #fff;
  }
  .nav-btn {
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: none;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    text-decoration: none;
    transition: all .2s;
    font-family: var(--font-ui);
  }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── 로그인 상태 배지 ── */
  .role-badge {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    font-size: 11px;
    font-family: var(--font-mono);
    cursor: default;
  }
  .role-badge .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--muted);
  }
  .role-badge.logged-in .dot { background: var(--success); }
  .role-badge .role-name { color: var(--text); }
  .role-badge .logout-btn {
    background: none; border: none;
    color: var(--muted); cursor: pointer;
    font-size: 11px; padding: 0 0 0 4px;
    transition: color .15s;
  }
  .role-badge .logout-btn:hover { color: var(--danger); }

  /* ── 로그인 모달 ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 200;
    animation: fadeIn .15s ease;
  }
  .modal-overlay.hidden { display: none; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px;
    width: 340px;
    box-shadow: 0 24px 80px rgba(0,0,0,.6);
  }
  .modal-title {
    font-size: 15px; font-weight: 600;
    font-family: var(--font-mono);
    color: var(--accent);
    margin-bottom: 24px;
    letter-spacing: 1px;
  }
  .modal-field { margin-bottom: 16px; }
  .modal-field label {
    display: block;
    font-size: 10px; color: var(--muted);
    letter-spacing: 1px; font-family: var(--font-mono);
    margin-bottom: 6px;
  }
  .modal-field input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
    font-family: var(--font-ui);
    outline: none;
    transition: border-color .2s;
  }
  .modal-field input:focus { border-color: var(--accent); }
  .modal-error {
    font-size: 12px; color: var(--danger);
    font-family: var(--font-mono);
    margin-bottom: 12px;
    min-height: 16px;
  }
  .modal-actions { display: flex; gap: 10px; margin-top: 8px; }
  .modal-btn {
    flex: 1; padding: 10px;
    border-radius: 8px; border: none;
    font-size: 13px; font-family: var(--font-ui);
    font-weight: 600; cursor: pointer;
    transition: opacity .2s;
  }
  .modal-btn:hover { opacity: .85; }
  .modal-btn.primary { background: var(--accent); color: #fff; }
  .modal-btn.cancel  { background: var(--bg); border: 1px solid var(--border); color: var(--muted); }

  /* ── 메인 레이아웃 ── */
  main { display: flex; flex: 1; overflow: hidden; }

  /* ── 사이드바 접이식 ── */
  .sidebar {
    width: 280px;
    border-right: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
    transition: width .25s ease;
  }
  .sidebar.collapsed { width: 0; border-right: none; }

  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .sidebar-title {
    font-size: 10px;
    font-family: var(--font-mono);
    color: var(--muted);
    letter-spacing: 1.5px;
  }
  .sidebar-toggle {
    background: none; border: none;
    color: var(--muted); cursor: pointer;
    font-size: 14px; padding: 2px 6px;
    border-radius: 4px;
    transition: color .15s, background .15s;
  }
  .sidebar-toggle:hover { color: var(--accent); background: rgba(124,106,247,.08); }

  /* 사이드바 열기 버튼 (닫혔을 때) */
  .sidebar-open-btn {
    position: absolute;
    left: 0; top: 50%;
    transform: translateY(-50%);
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: none;
    border-radius: 0 6px 6px 0;
    padding: 10px 6px;
    cursor: pointer;
    color: var(--muted);
    font-size: 12px;
    display: none;
    z-index: 10;
    transition: color .15s;
  }
  .sidebar-open-btn:hover { color: var(--accent); }
  .sidebar-open-btn.visible { display: block; }

  /* 파일 목록 스크롤 */
  .file-list {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0 12px 8px;
    min-height: 0;
    max-height: 100%;
  }
  .file-list::-webkit-scrollbar { width: 3px; }
  .file-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* ── 드래그 앤 드롭 영역 ── */
  .drop-zone {
    margin: 16px;
    border: 1.5px dashed var(--border);
    border-radius: 10px;
    padding: 24px 16px;
    text-align: center;
    cursor: pointer;
    transition: all .25s;
    position: relative;
  }
  .drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--accent);
    background: rgba(124,106,247,.06);
  }
  .drop-zone input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .drop-icon { font-size: 28px; margin-bottom: 8px; }
  .drop-label { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .drop-label strong { color: var(--accent); }
  .drop-types {
    margin-top: 8px;
    font-size: 10px;
    color: var(--muted);
    font-family: var(--font-mono);
  }

  /* ── 챗 지시 입력 ── */
  .instruction-box {
    margin: 0 16px 12px;
  }
  .instruction-box label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
    font-family: var(--font-mono);
    display: block;
    margin-bottom: 6px;
  }
  .instruction-box input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    color: var(--text);
    font-size: 12px;
    font-family: var(--font-ui);
    outline: none;
    transition: border-color .2s;
  }
  .instruction-box input:focus { border-color: var(--accent); }
  .instruction-box input::placeholder { color: var(--muted); }

  /* ── 업로드 파일 목록 ── */
  .file-list { flex: 1; overflow-y: auto; padding: 0 16px 16px; }
  .file-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 6px;
    font-size: 11px;
    animation: fadeIn .2s ease;
  }
  .file-icon { font-size: 16px; flex-shrink: 0; }
  .file-info { flex: 1; min-width: 0; }
  .file-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-size { color: var(--muted); font-family: var(--font-mono); font-size: 10px; }
  .file-status {
    font-size: 10px;
    font-family: var(--font-mono);
    padding: 2px 6px;
    border-radius: 4px;
  }
  .status-ready   { background: rgba(79,195,247,.12); color: var(--accent2); }
  .status-upload  { background: rgba(124,106,247,.12); color: var(--accent);  }
  .status-done    { background: rgba(76,175,125,.12);  color: var(--success); }
  .status-error   { background: rgba(240,98,146,.12);  color: var(--danger);  }
  .remove-btn {
    background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 13px; padding: 2px 4px;
    border-radius: 3px; flex-shrink: 0; line-height: 1;
    transition: color .15s;
  }
  .remove-btn:hover { color: var(--danger); }

  /* ── 파일별 폴더 입력 ── */
  .file-item { flex-direction: column; align-items: stretch; gap: 0; }
  .file-item-top {
    display: flex; align-items: center; gap: 8px;
  }
  .file-folder-row {
    display: flex; align-items: center; gap: 6px;
    margin-top: 6px; padding-top: 6px;
    border-top: 1px solid var(--border);
  }
  .folder-icon { font-size: 11px; flex-shrink: 0; }
  .folder-input {
    flex: 1;
    background: transparent;
    border: none;
    border-bottom: 1px dashed var(--border);
    color: var(--muted);
    font-size: 11px;
    font-family: var(--font-mono);
    padding: 2px 4px;
    outline: none;
    transition: all .2s;
  }
  .folder-input:focus {
    color: var(--accent2);
    border-bottom-color: var(--accent2);
  }
  .folder-input::placeholder { color: var(--muted); opacity: .6; }

  /* ── 진행 표시 (Issue #14) ── */
  .file-progress-row {
    display: flex; align-items: center; gap: 6px;
    margin-top: 4px;
  }
  .file-progress-bar {
    flex: 1; height: 3px;
    background: rgba(255,255,255,.06);
    border-radius: 2px; overflow: hidden;
  }
  .file-progress-fill {
    height: 100%; width: 0;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    transition: width .15s ease;
  }
  .file-progress-pct {
    font-size: 9px; font-family: var(--font-mono);
    color: var(--muted); min-width: 32px; text-align: right;
  }
  .queue-progress {
    margin: 0 16px 8px; padding: 8px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 11px; font-family: var(--font-mono);
  }
  .queue-progress-text { color: var(--accent2); margin-bottom: 4px; word-break: break-all; }
  .queue-progress-bar  {
    height: 2px; background: rgba(255,255,255,.06);
    border-radius: 1px; overflow: hidden;
  }
  .queue-progress-fill {
    height: 100%; width: 0; background: var(--accent);
    transition: width .2s ease;
  }

  .upload-btn {
    margin: 0 16px 16px;
    width: calc(100% - 32px);
    padding: 10px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 13px;
    font-family: var(--font-ui);
    font-weight: 600;
    cursor: pointer;
    transition: opacity .2s;
  }
  .upload-btn:hover { opacity: .85; }
  .upload-btn:disabled { opacity: .4; cursor: default; }

  /* ── 챗 영역 ── */
  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scroll-behavior: smooth;
  }

  /* ── 웰컴 메시지 ── */
  .welcome {
    text-align: center;
    margin: auto;
    padding: 40px 20px;
  }
  .welcome-title {
    font-size: 32px;
    font-weight: 300;
    letter-spacing: 4px;
    font-family: var(--font-mono);
    color: var(--accent);
    margin-bottom: 12px;
  }
  .welcome-title span { color: var(--accent2); }
  .welcome-sub { color: var(--muted); font-size: 14px; line-height: 1.6; }
  .welcome-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 24px;
  }
  .chip {
    padding: 7px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    transition: all .2s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }

  /* ── 메시지 버블 ── */
  .msg {
    display: flex;
    gap: 12px;
    max-width: 800px;
    animation: fadeIn .2s ease;
  }
  .msg.user { margin-left: auto; flex-direction: row-reverse; }
  .avatar {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  .avatar.james { background: rgba(124,106,247,.15); border: 1px solid var(--accent); }
  .avatar.user  { background: rgba(79,195,247,.15);  border: 1px solid var(--accent2); }
  .bubble {
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.65;
    max-width: calc(100% - 44px);
    word-break: break-word;
    overflow-wrap: break-word;
  }
  .msg.james .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px 12px 12px 12px;
  }
  .msg.user .bubble {
    background: rgba(124,106,247,.12);
    border: 1px solid rgba(124,106,247,.2);
    border-radius: 12px 4px 12px 12px;
  }
  .bubble code {
    font-family: var(--font-mono);
    font-size: 12px;
    background: rgba(255,255,255,.05);
    padding: 2px 5px;
    border-radius: 3px;
  }
  .bubble pre {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    margin: 8px 0;
    overflow-x: auto;
  }
  .bubble pre code { background: none; padding: 0; font-size: 12px; }

  .meta {
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
    font-family: var(--font-mono);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .meta .mode-badge {
    padding: 1px 6px;
    border-radius: 3px;
    background: rgba(124,106,247,.1);
    color: var(--accent);
  }
  .meta .graph-badge {
    padding: 1px 6px;
    border-radius: 3px;
    background: rgba(79,195,247,.1);
    color: var(--accent2);
  }

  /* 타이핑 인디케이터 */
  .typing { display: flex; gap: 4px; align-items: center; padding: 14px 16px; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted);
    animation: bounce .8s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }

  /* ── 입력창 ── */
  .input-area {
    border-top: 1px solid var(--border);
    padding: 16px 24px;
    background: var(--surface);
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .input-wrap {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    align-items: flex-end;
    padding: 4px 4px 4px 14px;
    transition: border-color .2s;
    gap: 6px;
  }
  .input-wrap:focus-within { border-color: var(--accent); }
  #chat-input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 14px;
    font-family: var(--font-ui);
    resize: none;
    max-height: 160px;
    min-height: 36px;
    line-height: 1.6;
    padding: 6px 0;
  }
  #chat-input::placeholder { color: var(--muted); }
  .send-btn {
    width: 36px; height: 36px;
    border-radius: 7px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    transition: opacity .2s;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .send-btn:hover { opacity: .85; }
  .send-btn:disabled { opacity: .4; cursor: default; }

  /* ── 그래프 경로 ── */
  .graph-paths {
    margin-top: 8px;
    padding: 8px 12px;
    background: var(--bg);
    border-left: 2px solid var(--accent2);
    border-radius: 0 6px 6px 0;
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--muted);
  }
  .graph-paths .path-title {
    color: var(--accent2);
    font-size: 10px;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  /* ── 스크롤바 ── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* ── 토스트 ── */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-family: var(--font-mono);
    animation: slideUp .25s ease;
    z-index: 100;
  }
  .toast.success { background: rgba(76,175,125,.15); border: 1px solid var(--success); color: var(--success); }
  .toast.error   { background: rgba(240,98,146,.15);  border: 1px solid var(--danger);  color: var(--danger);  }

  /* ── 애니메이션 ── */
  @keyframes fadeIn  { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes bounce  { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }
</style>
</head>
<body>

<!-- ── 헤더 ── -->
<header>
  <div class="logo">PROJECT <span>JAMES</span></div>
  <div class="header-right">
    <div class="source-toggle">
      <button class="active" onclick="setSource('prod', this)">PROD</button>
      <button onclick="setSource('test', this)">TEST</button>
    </div>
    <!-- [STEP 5-A] 언어 토글 -->
    <button class="nav-btn" data-lang-toggle onclick="toggleLang()" title="Language / 언어"
            style="font-size:11px;font-weight:700;padding:4px 8px"></button>
    <button class="nav-btn" onclick="clearHistory()" data-i18n-title="chat.clear_history" data-i18n-title="chat.clear_history" title="대화 초기화">🗑</button>
    <!-- [P3-4] 세션 선택 버튼 -->
    <button class="nav-btn" onclick="toggleSessionPanel()" data-i18n-title="chat.session_open" data-i18n-title="chat.session_open" title="이전 대화 불러오기"
            id="session-btn" style="position:relative">
      💬
      <span id="session-count-badge"
            style="display:none;position:absolute;top:-4px;right:-4px;
                   background:var(--accent);color:#fff;border-radius:8px;
                   font-size:9px;padding:1px 5px;font-weight:700">
      </span>
    </button>
    <div class="role-badge" id="role-badge" onclick="showLogin()">
      <span class="dot"></span>
      <span class="role-name" id="role-name" data-i18n="auth.login">로그인</span>
    </div>
    <a href="/admin" class="nav-btn">⚙ Admin</a>
  </div>
</header>

<!-- [P3-4] 세션 선택 패널 -->
<div id="session-panel"
     style="display:none;position:fixed;top:54px;right:16px;
            width:300px;max-height:420px;overflow-y:auto;
            background:var(--surface,#1e1e1e);border:1px solid var(--border,#333);
            border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.4);
            z-index:1000;padding:12px">
  <div style="display:flex;justify-content:space-between;align-items:center;
              margin-bottom:10px">
    <div style="font-weight:700;font-size:13px"><span data-i18n="chat.previous">💬 이전 대화</span></div>
    <div style="display:flex;gap:6px">
      <button onclick="newSession()"
              style="background:var(--accent,#7c6af7);color:#fff;border:none;
                     border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px">
        <span data-i18n="chat.new_session">+ 새 대화</span>
      </button>
      <button onclick="toggleSessionPanel()"
              style="background:none;border:none;color:var(--muted);
                     cursor:pointer;font-size:16px">✕</button>
    </div>
  </div>
  <div id="session-list">
    <div style="color:var(--muted);font-size:12px;text-align:center;padding:20px"
         data-i18n="common.loading">
      Loading...
    </div>
  </div>
</div>

<main style="position:relative">
  <button class="sidebar-open-btn" id="sidebar-open-btn"
          onclick="toggleSidebar()" data-i18n-title="upload.open" title="업로드 열기">▶</button>
  <!-- ── 사이드바 ── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">▸ <span data-i18n="upload.title">파일 업로드</span></div>
      <button class="sidebar-toggle" onclick="toggleSidebar()" data-i18n-title="common.close" title="닫기">◀</button>
    </div>

    <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
      <input type="file" id="file-input" multiple accept="image/*,video/*,audio/*,.pdf,.txt,.md,.json">
      <div class="drop-icon">📂</div>
      <div class="drop-label">
        <span data-i18n="upload.drag_label">클릭하거나 드래그하여 파일 추가</span><br>
        <span class="drop-types"><span data-i18n="upload.types">이미지 · 영상 · 오디오 · PDF · 문서</span></span>
      </div>
    </div>

    <div class="instruction-box">
      <label><span data-i18n="upload.common_label">💬 공통 저장 지시 (폴더 미지정 파일에 적용)</span></label>
      <input type="text" id="save-instruction"
             placeholder="e.g., Save to 2026 reports folder"
             data-i18n-placeholder="upload.folder_example">
    </div>

    <div class="file-list" id="file-list"></div>

    <!-- 큐 진행 표시 (Issue #14) — 다중 파일 업로드 동안 표시 -->
    <div class="queue-progress" id="queue-progress" style="display:none;">
      <div class="queue-progress-text" id="queue-progress-text"></div>
      <div class="queue-progress-bar"><div class="queue-progress-fill" id="queue-progress-fill"></div></div>
    </div>

    <button class="upload-btn" id="upload-btn" onclick="uploadFiles()" disabled>
      <span data-i18n="upload.btn_default">업로드 및 분석</span>
    </button>
  </aside>

  <!-- ── 챗 영역 ── -->
  <section class="chat-area">
    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-title">PROJECT <span>JAMES</span></div>
        <div class="welcome-sub">
          <span data-i18n="app.subtitle">보안 중심 Graph-RAG 지식 추론 엔진</span><br>
          <span data-i18n="app.welcome">무엇이든 물어보세요</span>
        </div>
        <div class="welcome-chips">
          <span class="chip" onclick="useChip(this)" data-i18n="chat.example1">경제학이란 무엇인가?</span>
          <span class="chip" onclick="useChip(this)" data-i18n="chat.example3">업로드된 문서 요약해줘</span>
          <span class="chip" onclick="useChip(this)" data-i18n="chat.example_code">파이썬 함수 작성해줘</span>
          <span class="chip" onclick="useChip(this)" data-i18n="chat.example2">김철수 관련 자료 찾아줘</span>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea id="chat-input" placeholder="Type a message (Shift+Enter for new line)"
                  data-i18n-placeholder="chat.placeholder" rows="1"
          oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">▲</button>
      </div>
    </div>
  </section>
</main>

<script src="/static/i18n.js"></script>
<script src="/static/chat.js"></script>
<script src="/static/upload.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', () => { restoreHistory(); });

  function toggleSidebar() {
    const sb  = document.getElementById('sidebar');
    const btn = document.getElementById('sidebar-open-btn');
    const tog = sb.querySelector('.sidebar-toggle');
    const collapsed = sb.classList.toggle('collapsed');
    btn.classList.toggle('visible', collapsed);
    if (tog) tog.textContent = collapsed ? '▶' : '◀';
  }
</script>

<!-- ── 로그인 모달 ── -->
<div class="modal-overlay hidden" id="login-modal" onclick="closeLoginOutside(event)">
  <div class="modal">
    <div class="modal-title">▸ <span data-i18n="auth.login_title">JAMES 로그인</span></div>
    <div class="modal-field">
      <label data-i18n="auth.username">아이디</label>
      <input type="text" id="login-id" placeholder="admin"
           autocomplete="off" spellcheck="false">
    </div>
    <div class="modal-field">
      <label data-i18n="auth.password">비밀번호</label>
      <input type="password" id="login-pw" placeholder="••••••••"
             autocomplete="new-password"
             onkeydown="if(event.key==='Enter') doLogin()">
    </div>
    <div class="modal-error" id="login-error"></div>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeLogin()" data-i18n="common.cancel">취소</button>
      <button class="modal-btn primary" onclick="doLogin()" data-i18n="auth.login">로그인</button>
    </div>
  </div>
</div>
</body>
</html>
