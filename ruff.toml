# JAMES — ruff config
#
# Phase 1 (2026-05-11): enforce F821 (undefined names) only.
# Phase 2 (2026-05-11, this commit): auto-fix F541 (empty f-strings,
#                          96 cleared, ENFORCED). F401 partially
#                          auto-fixed (164 of 206 cleared); 42
#                          remaining are intentional try-import
#                          availability checks — Phase 3 will mark
#                          them ``# noqa: F401`` and then enforce.
# Phase 3:                 noqa-mark remaining F401, fix F841
#                          unused-variable + F811 redefined-while-unused.
# Phase 4:                 extend to E (pycodestyle), W, I (isort).
#
# Current Pyflakes inventory (snapshot at 2026-05-11, post-Phase 2):
#   F821 — 0   ← enforced (Phase 1)
#   F541 — 0   ← enforced (Phase 2, was 96)
#   F401 — 42  ← intentional try-import availability checks; Phase 3
#                will noqa-mark + enforce. Was 206 before Phase 2.
#   F841 — 28  (auto-fixable, Phase 3)
#   F811 — 4   (manual, Phase 3)
#
# Why F821 first
# --------------
# F821 catches genuine NameErrors — code that will raise at runtime as
# soon as the affected branch executes. Before this commit, GET
# /hardware/ in psutil-less environments raised NameError on the
# fallback path (platform was used without import); after the fix the
# default specs render. Style rules (E/W) and import hygiene (F401)
# are cleanups, not correctness bugs — they wait until F-class is
# clean.
#
# How to run
# ----------
#   ruff check .              # respects this file's [lint.select]
#   ruff check --select F .   # full Pyflakes inventory (333 errors today)
#   ruff check --fix .        # apply auto-fixable rules
target-version = "py311"

# Generated / vendored / runtime-data — never linted. ``exclude`` is
# a top-level setting, not part of [lint].
exclude = [
    "venv/",
    ".venv/",
    "env/",
    "ENV/",
    "build/",
    "dist/",
    "models/",
    "chroma_db/",
    "wiki/",
    "workspace/",
    "uploads/",
    "backups/",
    "memory/",
    "reports/",
    "frontend/",       # JS/HTML/CSS, not Python
    ".cache/",
    "tmp/",
    "temp/",
    "*.pyc",
    "__pycache__/",
]

[lint]
# Phase 1 + Phase 2 selectors.
select = ["F821", "F541"]
